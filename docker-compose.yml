version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - movie-recommender

  frontend:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./streamlit_app:/app/streamlit_app
    environment:
      - PYTHONPATH=/app
    command: streamlit run streamlit_app/app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      - api
    networks:
      - movie-recommender

networks:
  movie-recommender:
    driver: bridge

volumes:
  movie_data:
  movie_models: